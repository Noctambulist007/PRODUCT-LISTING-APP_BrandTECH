name: productify
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.1
  flutter_riverpod: ^3.3.1
  flutter_screenutil: ^5.9.3
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  icons_launcher: ^3.0.3
  intl: ^0.20.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.5
  shimmer: ^3.0.0
  zentoast: ^0.2.2
  timezone: ^0.11.0
  flutter_carousel_intro: ^1.0.13
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  awesome_dio_interceptor: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf

  assets:
    - assets/icons/
    - assets/images/
    - assets/logo/
    - assets/fonts/
    - assets/github_readme/
